# Ejemplo: subrr + un LibreTranslate local como motor de reserva.
#
# AVISO: NO expongas subrr a internet. No tiene cuentas de usuario: cualquiera que llegue a la web puede cambiar sus
# ajustes, y guarda tus claves de API. Déjalo en tu red local / VPN (Tailscale, WireGuard…) o detrás de un proxy inverso
# con autenticación, y define SUBRR_PASSWORD más abajo. Mira SECURITY.md.
services:
  subrr:
    build: .                      # o: image: ghcr.io/m0uwastaken/subrr:latest
    container_name: subrr
    user: "1000:1000"             # el mismo usuario que es dueño de tus archivos de vídeo
    environment:
      TZ: Europe/Madrid
      # --- Seguridad (recomendado) ---
      # SUBRR_PASSWORD: "cambiame"            # contraseña HTTP Basic de la web (/salud y los webhooks quedan abiertos)
      # SUBRR_WEBHOOK_TOKEN: "una-cadena-larga-y-aleatoria"   # token de los webhooks de Sonarr/Radarr; si no lo defines, se
      #                                                       # genera al arrancar la primera vez y sale en Ajustes → Conexiones
      # --- Opcional: valores iniciales; todo se puede definir (y cambiar) en la web ---
      SONARR_URL: http://sonarr:8989
      SONARR_KEY: ""
      RADARR_URL: http://radarr:7878
      RADARR_KEY: ""
      BAZARR_URL: http://bazarr:6767
      BAZARR_KEY: ""
      DEEPL_KEY: ""               # DeepL API Free: 500.000 caracteres al mes gratis
      LIBRETRANSLATE_URL: http://libretranslate:5000
    volumes:
      - ./config:/config          # ajustes (con claves de API), estado y caché
      # Monta tus medios en la MISMA ruta que usan Sonarr/Radarr. Con la estructura de las guías TRaSH es /data
      # (p. ej. /data/media/tv, /data/media/movies). Misma ruta = no hace falta mapeo de rutas. Usa la misma carpeta del
      # servidor que Sonarr/Radarr y conserva la misma carpeta superior para que los enlaces duros sigan funcionando.
      - /ruta/a/data:/data
    ports:
      - "127.0.0.1:3007:3007"     # solo desde esta máquina. Usa "3007:3007" para entrar desde tu red local (y define SUBRR_PASSWORD)
    # Para que Sonarr/Radarr/Bazarr lleguen a subrr como http://subrr:3007 (webhooks) y subrr a ellos como http://sonarr:8989,
    # todos deben compartir una red de Docker. Busca la que usan tus apps *arr (docker network ls) y descomenta:
    # networks:
    #   - arr
    restart: unless-stopped

  libretranslate:                 # opcional, gratis y local; se usa de reserva
    image: libretranslate/libretranslate:v1.9.6
    container_name: libretranslate
    environment:
      LT_LOAD_ONLY: en,es,fr,it,pt,de   # idiomas de origen y destino que necesites
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - ./libretranslate:/home/libretranslate/.local   # modelos descargados (~1-2 GB)
    # networks:
    #   - arr
    restart: unless-stopped

# Descomenta junto con las líneas "networks:" de arriba. Cambia "arr" por el nombre real de la red de tu pila *arr
# (p. ej. la red "default" de su proyecto de compose: <proyecto>_default), o pon subrr en ese mismo compose.
# networks:
#   arr:
#     external: true
#     name: <tu-red-arr>
